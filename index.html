  <style>
    :root {
      --bg-main: #0a0f1d;
      --bg-surface: #111827;
      --bg-surface-elevated: #1f293d;
      --bg-card: rgba(17, 24, 39, 0.88);
      
      --accent-cyan: #00d2ff;
      --accent-blue: #3a7bd5;
      --accent-glow: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
      
      --border: #243048;
      --border-bright: #334155;
      --border-glow: rgba(0, 210, 255, 0.35);

      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --shadow-glow: 0 0 35px rgba(0, 210, 255, 0.15);
      --shadow-card: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      color: var(--text-main);
      background-color: var(--bg-main);
      line-height: 1.6;
      overflow-x: hidden;
    }

    body.modal-open {
      overflow: hidden;
    }

    /* Top Announcement Bar */
    .top-banner {
      background: #060a14;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.55rem 1rem;
      font-size: 0.85rem;
      text-align: center;
      position: relative;
      z-index: 101;
    }
    .top-banner a {
      color: var(--accent-cyan);
      text-decoration: none;
      font-weight: 700;
      margin-left: 0.4rem;
    }
    .top-banner a:hover {
      text-decoration: underline;
    }

    /* Navigation */
    header {
      background: rgba(10, 15, 29, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      max-width: 1150px;
      margin: auto;
      padding: 0.95rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.35rem;
      font-weight: 800;
      color: #ffffff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      letter-spacing: -0.5px;
    }

    .logo span {
      background: var(--accent-glow);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1.35rem;
    }

    .nav-phone {
      font-weight: 700;
      color: #ffffff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .nav-phone:hover {
      color: var(--accent-cyan);
    }

    .nav-cta {
      background: var(--accent-glow);
      color: #060a14;
      padding: 0.65rem 1.35rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
      transition: all 0.2s ease;
    }

    .nav-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(0, 210, 255, 0.5);
    }

    /* Hero Section */
    .hero {
      position: relative;
      padding: 2.5rem 1.5rem 4.5rem;
      text-align: center;
      background: radial-gradient(circle at 50% 15%, rgba(0, 210, 255, 0.08) 0%, transparent 60%);
      border-bottom: 1px solid var(--border);
    }

    .hero-container {
      max-width: 950px;
      margin: auto;
      position: relative;
      z-index: 1;
    }

    /* Featured Top Banner Container */
    .hero-banner-wrapper {
      width: 100%;
      max-width: 900px;
      max-height: 400px;
      margin: 0 auto 2.5rem;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border-glow);
      box-shadow: 0 15px 45px rgba(0, 210, 255, 0.15), 0 10px 25px rgba(0, 0, 0, 0.6);
      position: relative;
      background: #060a14;
    }

    .hero-banner-wrapper img {
      width: 100%;
      height: 100%;
      max-height: 400px;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      background: rgba(0, 210, 255, 0.08);
      border: 1px solid rgba(0, 210, 255, 0.3);
      color: var(--accent-cyan);
      padding: 0.4rem 1.1rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      background: #00d2ff;
      border-radius: 50%;
      box-shadow: 0 0 8px #00d2ff;
    }

    .hero h1 {
      font-size: 2.85rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
      letter-spacing: -1px;
      margin-bottom: 1rem;
    }

    .hero h1 .highlight {
      background: var(--accent-glow);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      font-size: 1.15rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      line-height: 1.65;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    .hero-buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: var(--accent-glow);
      color: #060a14;
      padding: 0.95rem 2.1rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 800;
      box-shadow: 0 0 25px rgba(0, 210, 255, 0.35);
      transition: all 0.2s ease;
      display: inline-block;
      cursor: pointer;
      border: none;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 35px rgba(0, 210, 255, 0.6);
    }

    .btn-phone {
      background: rgba(31, 41, 61, 0.6);
      color: #ffffff;
      border: 1px solid var(--border-bright);
      padding: 0.95rem 1.85rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
    }

    .btn-phone:hover {
      background: rgba(31, 41, 61, 0.95);
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
    }

    /* Services Section */
    .section {
      max-width: 1150px;
      margin: auto;
      padding: 4.5rem 1.5rem;
      position: relative;
      z-index: 1;
    }

    .section-title {
      text-align: center;
      margin-bottom: 3.5rem;
    }

    .section-title h2 {
      font-size: 2.25rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 0.5rem;
    }

    .section-title p {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2.2rem;
      position: relative;
      transition: all 0.25s ease;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(10px);
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--border-glow);
      box-shadow: 0 10px 30px -5px rgba(0, 210, 255, 0.15);
    }

    .card-icon-wrapper {
      width: 54px;
      height: 54px;
      border-radius: 12px;
      background: rgba(0, 210, 255, 0.08);
      border: 1px solid rgba(0, 210, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.65rem;
      margin-bottom: 1.25rem;
    }

    .card h3 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    .card-link {
      background: none;
      border: none;
      color: var(--accent-cyan);
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0;
      text-align: left;
      transition: color 0.2s;
    }

    .card-link:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    /* Detail Modal */
    .modal-overlay {

      top: 0;
      left: 0;
      width: 100vw;
